spring.application.name=programas-service
server.port=8082

# Base de datos H2 guardada en un archivo (carpeta data/ del servicio)
spring.datasource.url=jdbc:h2:file:./data/programas-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 (si tu versión la incluye): http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# No exponer detalles internos en los errores
server.error.include-message=never
server.error.include-stacktrace=never