spring.application.name=funcionarios-service
server.port=9202

# Base de datos H2 en archivo (carpeta data/ dentro de este servicio)
spring.datasource.url=jdbc:h2:file:./data/funcionarios-db
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# No exponer detalles internos en los errores
server.error.include-message=never
server.error.include-stacktrace=never

# Seguridad del login
corpaliv.seguridad.max-intentos=5
corpaliv.seguridad.bloqueo-minutos=5
