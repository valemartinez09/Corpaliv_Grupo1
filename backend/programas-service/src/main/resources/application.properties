spring.application.name=programas-service
server.port=8082

# Base de datos H2 en archivo (carpeta data/ dentro de este servicio)
spring.datasource.url=jdbc:h2:file:./data/programas-db
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# No exponer detalles internos en los errores
server.error.include-message=never
server.error.include-stacktrace=never
